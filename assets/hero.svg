<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" width="1000" height="440" font-family="Segoe UI, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#061629"/><stop offset="0.6" stop-color="#0A2540"/><stop offset="1" stop-color="#07323a"/>
    </linearGradient>
    <linearGradient id="mint" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7dffe0"/><stop offset="1" stop-color="#00D09C"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00D09C"/><stop offset="1" stop-color="#E5A93C"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d3157"/><stop offset="1" stop-color="#061629"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#00D09C" stop-opacity="0.45"/><stop offset="1" stop-color="#00D09C" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>

  <rect width="1000" height="440" fill="url(#bg)"/>
  <ellipse cx="790" cy="230" rx="260" ry="190" fill="url(#glow)"/>

  <!-- perspective floor grid -->
  <g stroke="#00D09C" stroke-opacity="0.22" stroke-width="1" fill="none">
    <path d="M500 230 L-300 440 M500 230 L-100 440 M500 230 L100 440 M500 230 L300 440 M500 230 L500 440 M500 230 L700 440 M500 230 L900 440 M500 230 L1100 440 M500 230 L1300 440"/>
    <path d="M0 262 H1000 M0 292 H1000 M0 330 H1000 M0 378 H1000 M0 436 H1000" stroke-opacity="0.16"/>
  </g>

  <!-- 3D extruded title -->
  <g font-weight="900" font-size="112" letter-spacing="4">
    <text x="62" y="212" fill="#021019">AK BANK</text>
    <text x="60" y="210" fill="#023a33">AK BANK</text>
    <text x="58" y="208" fill="#035246">AK BANK</text>
    <text x="56" y="206" fill="#04705f">AK BANK</text>
    <text x="54" y="204" fill="#058f78">AK BANK</text>
    <text x="52" y="202" fill="#06ad92">AK BANK</text>
    <text x="50" y="200" fill="url(#mint)">AK BANK</text>
  </g>
  <text x="54" y="250" font-size="30" font-style="italic" fill="#E5A93C" letter-spacing="2">Banking Made Simple.</text>

  <!-- tech pills -->
  <g font-size="15" font-weight="600" text-anchor="middle">
    <g transform="translate(54,288)"><rect width="92" height="32" rx="16" fill="#00D09C" fill-opacity="0.15" stroke="#00D09C"/><text x="46" y="21" fill="#7dffe0">Kotlin</text></g>
    <g transform="translate(156,288)"><rect width="150" height="32" rx="16" fill="#00D09C" fill-opacity="0.15" stroke="#00D09C"/><text x="75" y="21" fill="#7dffe0">Jetpack Compose</text></g>
    <g transform="translate(316,288)"><rect width="84" height="32" rx="16" fill="#E5A93C" fill-opacity="0.15" stroke="#E5A93C"/><text x="42" y="21" fill="#E5A93C">Room</text></g>
    <g transform="translate(410,288)"><rect width="96" height="32" rx="16" fill="#E5A93C" fill-opacity="0.15" stroke="#E5A93C"/><text x="48" y="21" fill="#E5A93C">FastAPI</text></g>
  </g>
  <text x="54" y="356" font-size="14" fill="#8fb3cc" letter-spacing="1">DEMO PROJECT  •  RBAC  •  VIRTUAL CARDS  •  AI ASSISTANT</text>

  <!-- floating phone (isometric) -->
  <g transform="translate(700,50)">
    <ellipse cx="110" cy="345" rx="95" ry="14" fill="#000" fill-opacity="0.45" filter="url(#blur)"/>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -14;0 0" dur="4.5s" repeatCount="indefinite"/>
      <g transform="skewY(-6)">
        <!-- depth layers -->
        <rect x="26" y="22" width="180" height="320" rx="30" fill="#021019"/>
        <rect x="22" y="18" width="180" height="320" rx="30" fill="#04364a"/>
        <rect x="18" y="14" width="180" height="320" rx="30" fill="#06506b"/>
        <rect x="14" y="10" width="180" height="320" rx="30" fill="#0b6d8c"/>
        <!-- body -->
        <rect x="10" y="6" width="180" height="320" rx="30" fill="#0f2a44" stroke="#00D09C" stroke-width="2"/>
        <rect x="20" y="18" width="160" height="296" rx="22" fill="url(#screen)"/>
        <rect x="76" y="24" width="48" height="8" rx="4" fill="#021019"/>
        <!-- screen UI -->
        <text x="34" y="62" font-size="12" fill="#8fb3cc">Total Balance</text>
        <text x="34" y="88" font-size="22" font-weight="800" fill="#ffffff">Rs 1,245,000</text>
        <polyline points="34,150 60,132 84,142 108,112 132,124 156,96 168,100" fill="none" stroke="#00D09C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
          <animate attributeName="stroke-opacity" values="0.5;1;0.5" dur="3s" repeatCount="indefinite"/>
        </polyline>
        <g>
          <rect x="34" y="176" width="64" height="40" rx="10" fill="#00D09C" fill-opacity="0.18" stroke="#00D09C" stroke-opacity="0.6"/>
          <rect x="104" y="176" width="64" height="40" rx="10" fill="#E5A93C" fill-opacity="0.18" stroke="#E5A93C" stroke-opacity="0.6"/>
          <rect x="34" y="224" width="64" height="40" rx="10" fill="#E5A93C" fill-opacity="0.18" stroke="#E5A93C" stroke-opacity="0.6"/>
          <rect x="104" y="224" width="64" height="40" rx="10" fill="#00D09C" fill-opacity="0.18" stroke="#00D09C" stroke-opacity="0.6"/>
          <g font-size="11" fill="#ffffff" text-anchor="middle" font-weight="600">
            <text x="66" y="200">Transfer</text><text x="136" y="200">Bills</text>
            <text x="66" y="248">Top-up</text><text x="136" y="248">Cards</text>
          </g>
        </g>
        <rect x="52" y="284" width="96" height="6" rx="3" fill="#ffffff" fill-opacity="0.4"/>
      </g>
    </g>
  </g>

  <!-- floating virtual card -->
  <g transform="translate(600,150) rotate(-14)">
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -18;0 0" dur="5.5s" repeatCount="indefinite"/>
      <rect x="10" y="10" width="200" height="124" rx="16" fill="#021019" fill-opacity="0.6"/>
      <rect x="6" y="6" width="200" height="124" rx="16" fill="#8a6420"/>
      <rect x="3" y="3" width="200" height="124" rx="16" fill="#b98a2d"/>
      <rect width="200" height="124" rx="16" fill="url(#card)"/>
      <rect x="18" y="30" width="34" height="26" rx="5" fill="#ffe9b0" fill-opacity="0.9"/>
      <text x="18" y="22" font-size="13" font-weight="800" fill="#0A2540" letter-spacing="2">AK BANK</text>
      <text x="18" y="92" font-size="16" font-weight="700" fill="#0A2540" letter-spacing="3">•••• •••• •••• 4242</text>
      <text x="18" y="114" font-size="10" fill="#0A2540" fill-opacity="0.8" letter-spacing="1">DEMO CARDHOLDER</text>
      <text x="150" y="114" font-size="10" fill="#0A2540" fill-opacity="0.8">12/29</text>
      <path d="M0 0 H200 V40 Q100 70 0 40Z" fill="#ffffff" fill-opacity="0.12"/>
    </g>
  </g>

  <!-- 3D coins -->
  <g>
    <g transform="translate(930,90)">
      <animateTransform attributeName="transform" type="translate" values="930 90;930 74;930 90" dur="3.6s" repeatCount="indefinite"/>
      <ellipse cx="0" cy="6" rx="22" ry="22" fill="#8a6420"/>
      <ellipse cx="0" cy="0" rx="22" ry="22" fill="#E5A93C"/>
      <ellipse cx="0" cy="0" rx="14" ry="14" fill="none" stroke="#fff3c9" stroke-width="2"/>
      <text x="0" y="6" font-size="16" font-weight="800" fill="#fff3c9" text-anchor="middle">Rs</text>
    </g>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 12;0 0" dur="4.2s" repeatCount="indefinite"/>
      <ellipse cx="640" cy="366" rx="16" ry="16" fill="#8a6420"/>
      <ellipse cx="640" cy="360" rx="16" ry="16" fill="#E5A93C"/>
      <ellipse cx="640" cy="360" rx="10" ry="10" fill="none" stroke="#fff3c9" stroke-width="2"/>
    </g>
  </g>
</svg>
